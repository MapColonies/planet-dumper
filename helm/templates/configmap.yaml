{{- $releaseName := .Release.Name -}}
{{- $chartName := include "planet-dumper.name" . -}}
{{- $tracingUrl := include "planet-dumper.tracingUrl" . -}}
{{- if .Values.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $releaseName }}-{{ $chartName }}-configmap
data:
  {{- with .Values.postgres }}
  PGHOST: {{ .host }}
  PGPORT: {{ .port | default 5432 | quote }}
  PGDATABASE: {{ .database }}
  POSTGRES_ENABLE_SSL_AUTH: {{ .sslAuth.enabled | quote }}
  {{- if .sslAuth.enabled }}
  POSTGRES_CERTS_MOUNT_PATH: {{ .sslAuth.mountPath | quote }}
  {{- end }}
  {{- end }}
  LOG_LEVEL: {{ .Values.env.logLevel | quote }}
  LOG_PRETTY_PRINT_ENABLED: {{ .Values.env.logPrettyPrintEnabled | quote | default "false" }}
  TELEMETRY_TRACING_ENABLED: {{ .Values.env.tracing.enabled | quote }}
  {{- if .Values.env.tracing.enabled }}
  TELEMETRY_TRACING_URL: {{ $tracingUrl }}
  TELEMETRY_TRACING_RATIO: {{ .Values.env.tracing.ratio | quote }}
  {{- end }}
  HTTP_CLIENT_TIMEOUT: {{ .Values.env.httpClient.timeout | quote }}
  PG_DUMP_VERBOSE: {{ .Values.env.pgDump.verbose | quote }}
  NG_DUMP_VERBOSE: {{ .Values.env.ngDump.verbose | quote }}
  NG_DUMP_MAX_CONCURRENCY: {{ .Values.env.ngDump.maxConcurrency | quote }}
  OSMIUM_VERBOSE: {{ .Values.env.osmium.verbose | quote }}
  OSMIUM_PROGRESS: {{ .Values.env.osmium.progress | quote }}
  {{- with .Values.s3 }}
  S3_ENDPOINT: {{ printf "%s://%s:%v/" .protocol .host .port | quote }}
  S3_BUCKET_NAME: {{ .bucketName | quote }}
  S3_ACL: {{ .acl | default "private" | quote }}
  S3_UPLOAD_CONCURRENCY: {{ .upload.concurrency | quote }}
  S3_UPLOAD_PART_SIZE: {{ .upload.partSize | quote }}
  {{- end }}
  OUTPUT_FORMAT: {{ .Values.cli.outputFormat | quote }}
  STATE_SOURCE: {{ .Values.cli.stateSource | quote }}
  CLEANUP_MODE: {{ .Values.cli.cleanupMode | quote }}
  {{- with .Values.cli.create }}
  RESUME: {{ .resume | quote }}
  INFO: {{ .info | quote }}
  {{- if .dumpServer.enabled }}
  DUMP_SERVER_ENDPOINT: {{ .dumpServer.endpoint | quote }}
  {{- if .dumpServer.attachHeaders }}
  DUMP_SERVER_HEADERS: {{ .dumpServer.headers | toJson | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if .Values.cron.enabled }}
  TARGET: {{ .Values.cron.target | quote }}
  CRON_EXPRESSION: {{ .Values.cron.schedule | quote }}
  RUN_ON_INIT: {{ .Values.cron.runOnInit | quote }}
  {{- end }}
{{- end -}}
