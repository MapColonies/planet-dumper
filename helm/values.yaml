global:
  cloudProvider: {}
  tracing: {}
  metrics: {}
  environment: {}

mclabels:
  component: backend
  partOf: planet-dumper
  owner: vector
  prometheus:
    enabled: true

enabled: true
environment: development

jobAnnotations: {}
podAnnotations: {}
deploymentAnnotations: {}

cloudProvider:
  flavor: openshift
  dockerRegistryUrl: acrarolibotnonprod.azurecr.io

image:
  repository: planet-dumper-pg15
  # Overrides the image tag whose default is the chart appVersion.
  tag: 'v6.0.0-rc1'
  pullPolicy: IfNotPresent

job:
  enabled: false
  apiVersion: 'batch/v1' # depends on openshift version batch/v1 or batch/v1beta1
  restartPolicy: OnFailure
  ttlSecondsAfterFinished: 60
  backoffLimit: 6
# deploys an always-running Deployment (a single pod) which schedules the dump
# pipeline itself, in-process, via node-cron - replaces the old k8s CronJob model.
# only one of 'job'/'cron' can be enabled at the same time.
cron:
  enabled: true
  schedule: '*/5 * * * *' # standard cron expression, e.g. '0 3 * * 0' for weekly (every Sunday at 03:00)
  target: 'create' # which pipeline to run on each tick: 'create' | 'pg_dump'
  runOnInit: true # run once immediately on pod startup/restart, in addition to the schedule

resources:
  enabled: false
  value:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

env:
  logLevel: info
  logPrettyPrintEnabled: false
  tracing:
    enabled: false
    url: http://localhost:55681/v1/trace
    ratio: 1
  httpClient:
    timeout: 1000
  pgDump:
    verbose: false
  ngDump:
    verbose: false
    maxConcurrency: 4
  osmium:
    verbose: false
    progress: false
 
postgres:
  host: pg-osmdbt-postgresql
  username: postgres
  password: G3CGoRjpbZ
  database: osm
  port: 5432
  sslAuth:
    enabled: false
    secretName: secret-name
    mountPath: '/tmp/certs-postgres'

s3:
  accessKey: vector
  secretKey: vectorPassword
  host: 10.8.0.9
  port: 9000
  protocol: http
  bucketName: vector-planet-dumps
  acl: private
  upload:
    concurrency: 4
    partSize: 5 # in mb

pvc:
  enabled: true
  name: vector-planet-dumper-storage

cli:
  command: 'pg_dump' # which command the one-shot Job runs ('create' | 'pg_dump'); only applies when job.enabled is true
  outputFormat: dump_{state}_{timestamp}.pbf
  stateSource: 1 # replication url or specific state number
  cleanupMode: 'none'
  create:
    resume: false
    info: false
    dumpServer:
      enabled: true
      endpoint: https://test-dump-server-dump-server-route-vector-dev.apps.j1lk3njp.eastus.aroapp.io/
      attachHeaders: false
      headers: X-API-KEY=apikey

arstotzka:
  enabled: false
  serviceId: id
  networkCM: arstotzka-network-configmap
  mediator:
    timeout: 10000
    retryStrategy:
      enabled: false
      # retries: 3
      # shouldResetTimeout: false
      # isExponential: false
      # delay: 100
